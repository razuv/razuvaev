name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: friendly
    env:
      NODE_BIN: /home/friendly/.nvm/versions/node/v26.8.1/bin
    steps:
      - name: Add node to PATH
        run: echo "${NODE_BIN}" >> "$GITHUB_PATH"

      - name: Pull latest
        working-directory: /home/friendly/repo/razuvaev
        run: git pull --ff-only origin main

      - name: Build
        working-directory: /home/friendly/repo/razuvaev
        run: npm run build

      - name: Restart API service
        run: sudo -n systemctl restart 1337-pfapi