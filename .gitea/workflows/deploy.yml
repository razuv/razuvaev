name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: friendly
    steps:
      - name: Pull latest
        working-directory: /home/friendly/repo/razuvaev
        run: git pull --ff-only origin main

      - name: Build
        working-directory: /home/friendly/repo/razuvaev
        run: npm run build

      - name: Restart API service
        run: systemctl restart 1337-pfapi